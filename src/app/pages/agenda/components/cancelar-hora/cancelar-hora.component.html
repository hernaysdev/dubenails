<p *ngIf="telefonoPrivado" [class.telefono]="telefono" >
      {{telefono}}
</p>
<button type="button" *ngIf="botonCancelar" [disabled]="dia < day " [class.disabledButton]="dia < day " class="cancelarAgenda" (click)="cancelar()">
      Cancelar cita
</button>

<div class="modalCancelar" *ngIf="modalCancelar" role="alertdialog" aria-label="Confirmar cancelación">
      <strong>¿Cancelar la cita de {{ nombre }}?</strong>
      <div>
            <button type="button" (click)="cancelarOperacion(false)">No</button>
            <button type="button" class="si" (click)="cancelarOperacion(true)">Sí, cancelar</button>
      </div>
</div>
