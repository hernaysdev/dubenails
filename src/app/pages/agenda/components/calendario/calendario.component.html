<section class="agenda-mes">
    <!-- mes y total -->
    <div class="cabecera">
        <div class="navegacion">
            <button type="button" class="flecha" (click)="dateNext(0)" [disabled]="!puedeRetroceder" aria-label="Mes anterior">‹</button>
            <h2>{{ mes }} <span>{{ infoYear }}</span></h2>
            <button type="button" class="flecha" (click)="dateNext(+1)" [disabled]="!puedeAvanzar" aria-label="Mes siguiente">›</button>
        </div>
        <p *ngIf="rolUsuario === 'admin'" class="total">Total del mes <strong>{{ sumaValorMes | dinero }}</strong></p>
    </div>

    <!-- buscar clienta: marca en verde los dias en que tiene hora -->
    <form class="buscador" [formGroup]="formGroup">
        <input class="inputs" type="text" (keyup)="searchUser($event)" formControlName="usuario" placeholder="Buscar clienta…" aria-label="Buscar clienta" autocomplete="off">
        <div class="resultados" *ngIf="usersFilter.length">
            <button type="button" *ngFor="let users of usersFilter" (click)="selectUser(users.dia, users.nombre)">
                {{ users.nombre }} <span>día {{ users.dia }}</span>
            </button>
        </div>
    </form>

    <div class="calendario">
        <span class="dow" *ngFor="let d of semana">{{ d }}</span>
        <span *ngFor="let b of blancos"></span>
        <button type="button" class="dias" *ngFor="let diaAgenda of dias"
            [class.filter]="colorFilterDia.includes(diaAgenda.dia.toString())"
            [class.hoy]="esHoy(diaAgenda.dia)"
            [class.ocupado]="desfaseMes < 0 || diaAgenda.dia < day && mesActual === mesAgenda && yearActual === year
            || diaAgenda.diaName === 'domingo'  || diaAgenda.dia  < day +1 && rolUsuario !== 'admin' && mesActual === mesAgenda && yearActual === year"
            [attr.aria-label]="diaAgenda.diaName + ' ' + diaAgenda.dia"
            (click)="modalAgenda(diaAgenda.dia , mesAgenda , diaAgenda.diaName,  day, mesActual, mesAgenda)">
            {{ diaAgenda.dia }}
        </button>
    </div>
    <p class="leyenda"><i class="hoy"></i>Hoy <i class="filtro"></i>Clienta buscada <i class="apagado"></i>Pasado o domingo</p>
</section>

<app-detalles *ngIf="showModalDetalle"
[dia]="dia"
[desabilitarDia]="desabilitarDia"
(detalleComponent)="detalleComponents($event)"
></app-detalles>

<app-registrar-usuario
*ngIf="this.rolUsuario === ''"
(registroExitoso)="registroExitoso($event)"
></app-registrar-usuario>
<div class="btnInicio" *ngIf="this.rolUsuario === ''">
    <button (click)="navigateInicio()"> Ir al Inicio </button>
</div>
