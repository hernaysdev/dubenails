<section class="muro">
    <p class="msg-ok" *ngIf="mensajeOk" role="status">{{ mensajeOk }}</p>
    <p class="msg-error" *ngIf="mensajeError" role="alert">{{ mensajeError }}</p>
    <p class="meta" *ngIf="cargando">Cargando…</p>
    <p class="vacio" *ngIf="!cargando && !datas.length">Aún no hay publicaciones.</p>

    <app-post *ngFor="let p of datas; trackBy: porId" [post]="p" [rol]="rol" [logueado]="logueado" [destacada]="p.id === destacada"
        (borrar)="borrarArticulo($event)"></app-post>

    <button *ngIf="hayMas" type="button" class="ver-mas" (click)="verMas()" [disabled]="cargandoMas">
        {{ cargandoMas ? 'Cargando…' : 'Ver más publicaciones' }}
    </button>
</section>
