
<div class="registro">
    <form [formGroup]="formProductos">
        <label for="nombre">Nombre del servicio</label>
        <input formControlName="nombre" type="text" placeholder="nombre servicio">
         <label for="precio">Precio</label>
        <input 
        formControlName="precio" 
        type="number"
        mask="separator.0"
        thousandSeparator="."
        placeholder="20.000">
        <small class="meta" *ngIf="formProductos.value.precio > 0">Se verá como {{ formProductos.value.precio | dinero }}</small>
         <label for="tiempo">Duración</label>
        <select id="tiempo" formControlName="tiempo" class="duracion">
            <option *ngFor="let d of duraciones" [ngValue]="d.horas">{{ d.texto }}</option>
        </select>

        <label for="descripcion">Descripción <span class="opcional">(opcional)</span></label>
        <textarea id="descripcion" formControlName="descripcion" rows="5" maxlength="600" placeholder="Qué incluye, cuánto dura el resultado, cuidados…"></textarea>
        <small class="meta">Se ve al tocar el servicio en la portada. {{ formProductos.value.descripcion?.length || 0 }}/600</small>

        <input type="submit" [value]="guardando ? 'Creando…' : 'Crear servicio'" [disabled]="guardando" (click)="submit()">
        <p class="msg-ok" *ngIf="mensajeOk" role="status">{{ mensajeOk }}</p>
        <p class="msg-error" *ngIf="mensajeError" role="alert">{{ mensajeError }}</p>
    </form>
</div>
