<table>
    <thead>
        <tr>
            <th>Productos</th>
            <th>Precio</th>
            <th>Tiempo</th>
            <th></th>
        </tr>
    </thead>
    <tbody>
        <tr *ngFor="let producto of dataSource">
            <td>{{producto.nombre}}</td>
            <td>{{producto.precio}}$</td>
            <td>{{ duracion(producto.tiempo) }}</td>
            <td class="acciones">
                <a routerLink="../update" [queryParams]="{ id: producto._id }">Editar</a>
                <button type="button" (click)="deleteProducto(producto._id)">Eliminar</button>
            </td>
        </tr>
    </tbody>
</table>
