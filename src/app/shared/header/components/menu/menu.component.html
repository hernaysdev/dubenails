<nav [class.menuActive]="menu" class="menu">

    <ng-container *ngIf="menu; else cerrado">
        <!-- barra: volver (dentro de una seccion) + titulo + cerrar -->
        <div class="barra">
            <button type="button" class="icono" *ngIf="!lista" (click)="volver()" aria-label="Volver">
                <svg viewBox="0 0 24 24" width="22" height="22"><path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
            </button>
            <h3>{{ lista ? 'Menú' : tituloMenu }}</h3>
            <button type="button" class="icono" (click)="cerrarModal()" aria-label="Cerrar menú">
                <svg viewBox="0 0 24 24" width="20" height="20"><path d="M6 6l12 12M18 6L6 18" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg>
            </button>
        </div>

        <div class="cuerpo">
            <!-- sin sesion -->
            <ng-container *ngIf="!usuarioActivo">
                <div class="bienvenida" *ngIf="lista">
                    <img src="assets/icons/icon-192x192.png" alt="DubeNails" class="logo">
                    <h4>Te damos la bienvenida</h4>
                    <p>Inicia sesión para reservar más rápido, ver tus citas y publicar en el Muro.</p>
                    <button type="button" class="boton principal" (click)="login()">Iniciar sesión</button>
                    <button type="button" class="boton" (click)="showRegister()">Crear cuenta</button>
                    <button type="button" class="enlace" (click)="RecuperarClave()">¿Olvidaste tu contraseña?</button>
                </div>
                <app-registro class="f" *ngIf="showRegistro" (userActive)="loginUser($event)"></app-registro>
                <app-login class="f" (userActive)="loginUser($event)" *ngIf="showlogin"></app-login>
                <app-recuperar-clave class="f" *ngIf="showRecuperarClave"></app-recuperar-clave>
            </ng-container>

            <!-- con sesion -->
            <ng-container *ngIf="usuarioActivo && usuarioData">
                <ng-container *ngIf="lista">
                    <!-- perfil: tocar la foto para cambiarla (se comprime y se sube enseguida) -->
                    <div class="perfil">
                        <label class="avatar" [class.subiendo]="subiendoFoto">
                            <img [src]="usuarioData.image" alt="Tu foto de perfil" referrerpolicy="no-referrer" (error)="imagenFallida()">
                            <span class="camara" aria-hidden="true">
                                <svg viewBox="0 0 24 24" width="16" height="16"><path d="M4 7h3l2-2h6l2 2h3a1 1 0 0 1 1 1v11a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V8a1 1 0 0 1 1-1z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/><circle cx="12" cy="13" r="3.5" fill="none" stroke="currentColor" stroke-width="2"/></svg>
                            </span>
                            <span class="girando" *ngIf="subiendoFoto" aria-hidden="true"></span>
                            <input #inputFoto type="file" accept="image/*" (change)="cambiarFoto($event)" aria-label="Cambiar foto de perfil" [disabled]="subiendoFoto">
                        </label>
                        <div class="datos">
                            <strong>{{ usuarioData.nombre }}</strong>
                            <span>{{ usuarioData.correo }}</span>
                            <span *ngIf="usuarioData.telefono">{{ usuarioData.telefono }}</span>
                            <button type="button" class="cambiar" (click)="elegirFoto()" [disabled]="subiendoFoto">{{ subiendoFoto ? 'Subiendo foto…' : 'Cambiar foto' }}</button>
                        </div>
                    </div>
                    <p class="msg-ok mensaje-foto" *ngIf="mensajeFoto" role="status">{{ mensajeFoto }}</p>
                    <p class="msg-error mensaje-foto" *ngIf="errorFoto" role="alert">{{ errorFoto }}</p>

                    <ul class="opciones">
                        <li><button type="button" (click)="misCitas()">
                            <svg viewBox="0 0 24 24"><rect x="3.5" y="5" width="17" height="15" rx="2.5"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg>
                            {{ rolUser === 'admin' ? 'Reservas' : 'Mis citas' }}</button></li>
                        <li><button type="button" (click)="actualizarUser()">
                            <svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 20c1.5-4 4.5-6 8-6s6.5 2 8 6"/></svg>
                            Editar mis datos</button></li>
                        <li><button type="button" (click)="RegistrarArticulos()">
                            <svg viewBox="0 0 24 24"><rect x="3.5" y="3.5" width="17" height="17" rx="3"/><path d="M12 8v8M8 12h8"/></svg>
                            Publicar en el Muro</button></li>
                        <ng-container *ngIf="rolUser === 'admin'">
                            <li><button type="button" (click)="crearGiftCard()">
                                <svg viewBox="0 0 24 24"><rect x="3.5" y="8" width="17" height="12" rx="2"/><path d="M12 8v12M3.5 12h17M12 8C9 4 6 5 7.5 8M12 8c3-4 6-3 4.5 0"/></svg>
                                Crear GiftCard</button></li>
                            <li><button type="button" (click)="horario()">
                                <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/></svg>
                                Horario de atención</button></li>
                            <li><button type="button" (click)="productos()">
                                <svg viewBox="0 0 24 24"><path d="M5 8h14l-1.2 12H6.2z"/><path d="M9 8a3 3 0 0 1 6 0"/></svg>
                                Productos</button></li>
                        </ng-container>
                    </ul>
                    <button type="button" class="salir" (click)="salir()">Cerrar sesión</button>
                </ng-container>

                <app-registrar-articulos (success)="cargaArticulo($event)" [idUser]="id" *ngIf="showRegistroArticulos"></app-registrar-articulos>
                <app-actualizar-foto [idUser]="id" (imgUser)="imgUserCargada($event)" *ngIf="showActualizarFoto"></app-actualizar-foto>
                <app-actualizar-user class="f" *ngIf="showActualizarUser"></app-actualizar-user>
                <app-giftcard *ngIf="showGift"></app-giftcard>
                <app-horario-atencion *ngIf="showHorario" [enMenu]="true"></app-horario-atencion>
                <app-productos *ngIf="showProductos"></app-productos>
            </ng-container>
        </div>
    </ng-container>

    <!-- menu cerrado (en el header) -->
    <ng-template #cerrado>
        <div *ngIf="!usuarioActivo" class="menuFalse" (click)="showMenu()" aria-label="Abrir menú">
            <p></p>
            <p></p>
            <p></p>
        </div>
        <ng-container *ngIf="usuarioActivo && usuarioData">
            <div class="menuFalse usuario" [class.userImgNone]="!usuarioData.image" (click)="showMenu()" aria-label="Abrir menú">
                <img *ngIf="usuarioData.image" class="usuario" [class.imgGrande]="usuarioData.image"
                [src]="usuarioData.image" referrerpolicy="no-referrer" (error)="imagenFallida()" alt="">
            </div>
            <p *ngIf="!usuarioData.image" class="nombreUser">{{usuarioData.nombre}}</p>
        </ng-container>
    </ng-template>

</nav>
