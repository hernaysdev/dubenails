<div class="registro">
    <form [formGroup]="formArticulos" (ngSubmit)="enviar()">
        <!-- fotos: hasta 5 (carrusel). Solo image/*: con extensiones Android abre "Archivos" en vez de la galeria -->
        <div class="fotos" *ngIf="fotos.length">
            <div class="miniatura" *ngFor="let f of fotos; let i = index">
                <img *ngIf="f.vista" [src]="f.vista" [alt]="'Foto ' + (i + 1)">
                <span *ngIf="!f.vista" class="nombre-archivo">{{ f.archivo.name }}</span>
                <button type="button" class="quitar" (click)="quitarFoto(i)" [attr.aria-label]="'Quitar foto ' + (i + 1)">×</button>
            </div>
        </div>
        <label class="foto" *ngIf="fotos.length < maxFotos" [class.chica]="fotos.length">
            <input type="file" accept="image/*" multiple (change)="cargarImg($event)" aria-label="Elegir fotos">
            <span class="elegir">
                <svg viewBox="0 0 24 24" width="30" height="30" aria-hidden="true"><path d="M4 7h3l2-2h6l2 2h3a1 1 0 0 1 1 1v11a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V8a1 1 0 0 1 1-1z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><circle cx="12" cy="13" r="3.5" fill="none" stroke="currentColor" stroke-width="1.8"/></svg>
                <strong>{{ preparando ? 'Preparando fotos…' : (fotos.length ? 'Agregar otra foto' : 'Elegir fotos') }}</strong>
                <small>Hasta {{ maxFotos }} (ideal para antes y después)</small>
            </span>
        </label>

        <label for="art-titulo">Título</label>
        <input id="art-titulo" formControlName="nombre" type="text" maxlength="80" placeholder="Ej. Builder gel nude" autocomplete="off">

        <label for="art-descripcion">Descripción</label>
        <textarea id="art-descripcion" formControlName="descripcion" rows="3" maxlength="500" placeholder="Cuéntales sobre el diseño, el servicio o la clienta…"></textarea>
        <small class="contador">{{ formArticulos.value.descripcion?.length || 0 }}/500</small>


        <p class="msg-error" *ngIf="mensajeError" role="alert">{{ mensajeError }}</p>
        <button type="submit" class="publicar" [disabled]="enviando">{{ enviando ? 'Publicando…' : 'Publicar' }}</button>
    </form>
</div>
