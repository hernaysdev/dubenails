<div class="registro">
    <form [formGroup]="formRegister" (ngSubmit)="enviar()" novalidate>
        <label for="perfil-correo">Correo</label>
        <input id="perfil-correo" class="inputs" formControlName="correo" type="email" autocomplete="email" autocapitalize="none" />
        <small class="ayuda" *ngIf="invalido('correo')">Escribe un correo válido.</small>

        <label for="perfil-telefono">Teléfono</label>
        <input id="perfil-telefono" class="inputs" formControlName="telefono" type="tel" inputmode="numeric" maxlength="15" autocomplete="tel" />
        <small class="ayuda" *ngIf="invalido('telefono')">Escribe tu teléfono completo, solo números (mínimo 7).</small>

        <label for="perfil-direccion">Dirección (opcional)</label>
        <input id="perfil-direccion" class="inputs" formControlName="direccion" type="text" autocomplete="street-address" />

        <input type="submit" [value]="enviando ? 'Guardando…' : 'Guardar'" [disabled]="enviando">
        <p class="msg-ok" *ngIf="mensajeOk" role="status">{{ mensajeOk }}</p>
        <p class="msg-error" *ngIf="mensajeError" role="alert">{{ mensajeError }}</p>
    </form>
</div>
