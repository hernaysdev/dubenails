<div class="registro">
    <form [formGroup]="formLogin">
        <label for="login-usuario">Correo o usuario</label>
        <input 
        class="inputs"
        preventCutCopyPaste
        autocomplete="off"
        type="text" placeholder="tu@correo.com" autocapitalize="none" autocomplete="username"
        id="login-usuario"
        name="usuario"
        formControlName="usuario"
        />

        <label for="login-clave">Clave</label>
        <input 
        class="inputs"
        id="login-clave" type="password" placeholder="Mínimo 6 caracteres" autocomplete="current-password"
        preventCutCopyPaste
        autocomplete="off"
        formControlName="clave" />
        <input type="submit" value="Iniciar" (click)="login()">
        <p *ngIf="msgError" class="msg-error" role="alert">{{msgError}}</p>
    </form>

    <div class="googleLogin">
        <span class="separador">o</span>
        <app-boton-google texto="continue_with" (credencial)="loginGoogle($event)"></app-boton-google>
    </div>

</div>
