<div class="registro">
    <form [formGroup]="formRegister" (ngSubmit)="enviar()" novalidate>
        <label for="reg-nombre">Tu nombre</label>
        <input id="reg-nombre" class="inputs" formControlName="nombre" maxlength="40" type="text" placeholder="María José" autocomplete="name" />
        <small class="ayuda" *ngIf="invalido('nombre')">Escribe tu nombre.</small>

        <label for="reg-correo">Correo</label>
        <input id="reg-correo" class="inputs" formControlName="correo" type="email" placeholder="tu@correo.com" autocomplete="email" autocapitalize="none" />
        <small class="ayuda" *ngIf="invalido('correo')">Escribe un correo válido.</small>

        <label for="reg-telefono">Teléfono</label>
        <input id="reg-telefono" class="inputs" formControlName="telefono" type="tel" inputmode="numeric" maxlength="15" placeholder="8045550142" autocomplete="tel" />
        <small class="ayuda" *ngIf="invalido('telefono')">Escribe tu teléfono completo, solo números (mínimo 7).</small>

        <label for="reg-clave">Clave</label>
        <div class="clave">
            <input id="reg-clave" class="inputs" formControlName="password" [type]="verClave ? 'text' : 'password'" placeholder="Mínimo 6 caracteres" autocomplete="new-password" />
            <button type="button" class="ver" (click)="verClave = !verClave" [attr.aria-label]="verClave ? 'Ocultar clave' : 'Mostrar clave'">{{ verClave ? 'Ocultar' : 'Mostrar' }}</button>
        </div>
        <small class="ayuda" *ngIf="invalido('password')">Usa al menos 6 caracteres.</small>

        <input type="submit" [value]="enviando ? 'Creando cuenta…' : 'Crear cuenta'" [disabled]="enviando">
        <p class="msg-error" *ngIf="messageError" role="alert">{{ messageError }}</p>
    </form>
</div>
